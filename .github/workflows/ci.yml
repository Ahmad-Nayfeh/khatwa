name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
    # Documentation-only pushes (README, screenshots) do not need the emulator run.
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android · unit tests, APKs, emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 21 for the Firebase emulators (firebase-tools needs it); the last one (17) is the default for Gradle.
          java-version: |
            21
            17

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + app)
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Firebase config (real file from the secret, placeholder otherwise)
        env:
          KHATWA_GOOGLE_SERVICES_BASE64: ${{ secrets.KHATWA_GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ -n "$KHATWA_GOOGLE_SERVICES_BASE64" ]; then
            echo "$KHATWA_GOOGLE_SERVICES_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json: real (project $(python3 -c 'import json;print(json.load(open("app/google-services.json"))["project_info"]["project_id"])'))"
          else
            cp app/google-services.placeholder.json app/google-services.json
            echo "google-services.json: placeholder"
          fi

      - name: Decode release keystore (only if the secrets exist)
        env:
          KHATWA_KEYSTORE_BASE64: ${{ secrets.KHATWA_KEYSTORE_BASE64 }}
          KHATWA_KEYSTORE_PASSWORD: ${{ secrets.KHATWA_KEYSTORE_PASSWORD }}
          KHATWA_KEY_ALIAS: ${{ secrets.KHATWA_KEY_ALIAS }}
          KHATWA_KEY_PASSWORD: ${{ secrets.KHATWA_KEY_PASSWORD }}
        run: bash ci/prepare-signing.sh

      - name: Build APKs (debug, release, androidTest)
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace

      - name: Verify the release APK contains no debug hooks
        run: bash ci/verify-release.sh

      - name: Collect APKs
        run: |
          mkdir -p out
          VERSION=$(grep -E 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          cp app/build/outputs/apk/debug/app-debug.apk "out/khatwa-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/khatwa-${VERSION}.apk"
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: khatwa-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore

      - name: Free runner disk space for the emulator
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL \
            /usr/local/share/chromium /usr/local/lib/android/sdk/ndk /usr/lib/jvm/temurin-8-jdk-amd64 \
            /usr/lib/jvm/temurin-11-jdk-amd64 || true
          # (temurin-21 is kept: the Firebase emulators need Java 21 and the tool cache links to it.)
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Start the Firebase emulators (auth + firestore) for the groups test
        run: |
          cd firebase
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          java -version 2>&1 | tee /tmp/javaver.txt
          grep -q 'version "21' /tmp/javaver.txt || { echo "Java 21 not found at $JAVA_HOME_21_X64"; ls -la "$JAVA_HOME_21_X64" || true; exit 1; }
          npx --yes firebase-tools@15 emulators:start --only auth,firestore --project khatwa-de941 > ../ci/firebase-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080 >/dev/null && curl -sf http://127.0.0.1:9099 >/dev/null; then echo "firebase emulators up"; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8080 >/dev/null || { echo "firestore emulator did not start"; tail -50 ../ci/firebase-emulator.log; exit 1; }

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # AOSP image (no Google apps/services): the google_apis image kept hanging the
          # emulator's QEMU threads on the hosted runner until the runner itself was shut down.
          target: default
          arch: x86_64
          profile: pixel_6
          # 2 of the runner's 4 vCPUs: with 4 the emulator starves the runner agent
          # (QEMU "hanging thread" errors followed by "runner received a shutdown signal").
          cores: 2
          ram-size: 3072M
          disk-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash ci/emulator-tests.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            ci/evidence
            ci/firebase-emulator.log
          if-no-files-found: warn

  firestore-rules:
    name: Firestore · security rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        working-directory: firebase
        run: npm install --no-audit --no-fund
      - name: Rules tests against the Firestore emulator
        working-directory: firebase
        run: npm test

  windows:
    name: Windows · laptop lock (tests, single-file exe)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: C# unit tests (incl. shared HMAC vectors)
        run: dotnet test laptop-lock/KhatwaLock.Tests/KhatwaLock.Tests.csproj -c Release --logger "trx;LogFileName=results.trx"

      - name: Publish self-contained single-file exe
        run: |
          $version = (Select-String -Path app/build.gradle.kts -Pattern 'versionName = ' | Select-Object -First 1).Line -replace '.*"([^"]+)".*','$1'
          dotnet publish laptop-lock/KhatwaLock.App/KhatwaLock.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=false `
            -p:Version=$version -o out
          Copy-Item out/KhatwaLock.exe "out/khatwa-laptop-lock-$version.exe"
          Get-ChildItem out

      - name: Self-test the published exe (HMAC vectors + code output)
        run: |
          # The exe is a GUI-subsystem program: run it with redirected output and wait explicitly.
          $exe = (Get-ChildItem out/khatwa-laptop-lock-*.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed (exit $($p.ExitCode))" }
          $p = Start-Process -FilePath $exe -ArgumentList '--codes','ABCDEFGHJKLMNPQR','K7MP' -Wait -PassThru -NoNewWindow -RedirectStandardOutput code.txt
          $codes = (Get-Content code.txt -Raw)
          Write-Host "codes for shared vector:`n$codes"
          if ($codes -notmatch 'K7MP-Y3HE' -or $codes -notmatch 'MTL5-N2MS') { throw "code mismatch: '$codes'" }

      - name: UI smoke (lock form on the runner desktop, 3 s)
        continue-on-error: true
        run: |
          $exe = (Get-ChildItem out/khatwa-laptop-lock-*.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -ArgumentList '--ui-smoke','3' -Wait -PassThru -NoNewWindow -RedirectStandardOutput uismoke.txt
          Get-Content uismoke.txt
          Write-Host "ui-smoke exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "ui-smoke failed (the hosted runner may have no interactive desktop)" }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: khatwa-laptop-lock-exe
          path: |
            out/khatwa-laptop-lock-*.exe
            laptop-lock/install.ps1
            laptop-lock/uninstall.ps1
          if-no-files-found: error

      - name: Upload C# test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-test-results
          path: laptop-lock/KhatwaLock.Tests/TestResults
          if-no-files-found: ignore
