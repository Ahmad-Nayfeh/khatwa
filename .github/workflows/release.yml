name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Firebase config (real file from the secret, placeholder otherwise)
        env:
          KHATWA_GOOGLE_SERVICES_BASE64: ${{ secrets.KHATWA_GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ -n "$KHATWA_GOOGLE_SERVICES_BASE64" ]; then
            echo "$KHATWA_GOOGLE_SERVICES_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json: real"
          else
            cp app/google-services.placeholder.json app/google-services.json
            echo "google-services.json: placeholder (groups unavailable in this release)"
          fi

      - name: Decode release keystore
        env:
          KHATWA_KEYSTORE_BASE64: ${{ secrets.KHATWA_KEYSTORE_BASE64 }}
          KHATWA_KEYSTORE_PASSWORD: ${{ secrets.KHATWA_KEYSTORE_PASSWORD }}
          KHATWA_KEY_ALIAS: ${{ secrets.KHATWA_KEY_ALIAS }}
          KHATWA_KEY_PASSWORD: ${{ secrets.KHATWA_KEY_PASSWORD }}
        run: bash ci/prepare-signing.sh
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace
      - name: Build release APK
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          CODE=$(git rev-list --count HEAD)
          ./gradlew :app:assembleRelease -Pkhatwa.versionName="$VERSION" -Pkhatwa.versionCode="$CODE" --stacktrace
          bash ci/verify-release.sh
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/khatwa-${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: out/*.apk

  windows:
    name: Build laptop lock exe
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: C# tests
        run: dotnet test laptop-lock/KhatwaLock.Tests/KhatwaLock.Tests.csproj -c Release
      - name: Publish exe
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish laptop-lock/KhatwaLock.App/KhatwaLock.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version -o out
          Copy-Item out/KhatwaLock.exe "out/khatwa-laptop-lock-$version.exe"
          $p = Start-Process -FilePath (Resolve-Path "out/khatwa-laptop-lock-$version.exe") -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-exe
          path: |
            out/khatwa-laptop-lock-*.exe
            laptop-lock/install.ps1
            laptop-lock/uninstall.ps1

  publish:
    name: Publish GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: List assets
        run: find assets -type f
      - uses: softprops/action-gh-release@v2
        with:
          name: khatwa ${{ github.ref_name }}
          files: |
            assets/**/*.apk
            assets/**/*.exe
            assets/**/install.ps1
            assets/**/uninstall.ps1
          body: |
            ## khatwa ${{ github.ref_name }}

            **الجوال (أندرويد):** نزّل `khatwa-${{ needs.android.outputs.version }}.apk` على الجوال وافتحه لتثبيته (اسمح بالتثبيت من هذا المصدر إن طُلب). الشرح خطوة بخطوة في README ← الفقرة 1.

            **اللابتوب (ويندوز 10/11):** نزّل `khatwa-laptop-lock-${{ needs.android.outputs.version }}.exe` وشغّله، لا تثبيت ولا سكربتات: عند أول فتح يطلب كود الاقتران من الجوال (الإعدادات ← قفل اللابتوب)، ثم يعمل بالأكواد التي تظهر في الصفحة الرئيسية للجوال. إن ظهر تحذير SmartScreen اضغط «مزيد من المعلومات» ثم «التشغيل على أي حال». README ← الفقرة 2.

            `install.ps1` و`uninstall.ps1` اختياريان (تشغيل تلقائي عند الدخول بصلاحيات أعلى)؛ لا تحتاجهما في الاستخدام العادي.

            **Phone (Android):** download `khatwa-${{ needs.android.outputs.version }}.apk` on the phone and open it to install. **Laptop (Windows):** download and run `khatwa-laptop-lock-${{ needs.android.outputs.version }}.exe`; it asks for the pairing code from the phone on first launch. No installer needed.
